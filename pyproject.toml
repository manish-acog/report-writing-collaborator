[project]
name = "report-writing-collaborator"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "benchling-sdk==1.25.0",
    "google-adk==2.7.1",
    "litellm==1.98.0",
    "pydantic==2.13.4",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "rich==15.0.0",
    "typer==0.20.0",
]

[project.scripts]
report-writing-agent = "report_writing_collaborator.cli.main:app"

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "ruff==0.16.3",
    "ty==0.0.73",
]

[build-system]
requires = ["uv_build==0.8.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["canonical_workspace", "report_writing_collaborator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.11"
