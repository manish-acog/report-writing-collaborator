<style>

    font-family: Georgia, "Times New Roman", serif;
    color: #1a1a1a;
    max-width: 42rem;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.6;

  h1 {
    font-size: 1.75rem;
    border-bottom: 2px solid #1a1a1a;

<body>

<h2>Executive Summary</h2>

</html>
